# see https://github.com/systemd/mkosi/blob/v25.3/mkosi/resources/man/mkosi.1.md#execution-flow
# see https://github.com/systemd/mkosi/blob/v25.3/mkosi/resources/man/mkosi.1.md#configuration-settings

# see https://github.com/systemd/mkosi/blob/v25.3/mkosi/resources/man/mkosi.1.md#distribution-section
[Distribution]
Distribution=debian
Release=trixie

# see https://github.com/systemd/mkosi/blob/v25.3/mkosi/resources/man/mkosi.1.md#output-section
[Output]
Format=uki
# NB initrd is only split for debugging purposes. its not needed at runtime.
#    the .efi (uki) is the only file that is actually required.
SplitArtifacts=uki,initrd
OutputDirectory=../output
Output=hello-world

# see https://github.com/systemd/mkosi/blob/v25.3/mkosi/resources/man/mkosi.1.md#content-section
[Content]
Timezone=Europe/Lisbon
RootPassword=vagrant
Bootloader=none
KernelCommandLine=audit=0
WithRecommends=false
WithDocs=false
Packages=
    curl
    dbus
    efibootmgr
    iproute2
    iputils-ping
    less
    linux-image-generic
    login
    procps
    systemd
    systemd-boot-efi
    systemd-resolved
    tzdata
